name: Apple app and App Clip
on:
  pull_request:
    paths: ['apple/**', 'src/**', 'vite.config.ts', 'package*.json', '.github/workflows/apple.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:apple
      - run: npm run build:ios
      - name: Bundled UI and save migration browser tests (mock native transport)
        run: |
          npm ci --prefix apple/browser-tests
          npm test --prefix apple/browser-tests
      - name: Core security and protocol tests
        run: swift test --package-path apple
      - name: Generate native project
        run: |
          brew install xcodegen
          sips -z 1024 1024 apple/Resources/Assets.xcassets/AppIcon.appiconset/Icon.png >/dev/null
          cd apple
          xcodegen generate
      - name: Build containing app and App Clip for devices
        run: xcodebuild -project apple/OpenHistoria.xcodeproj -scheme OpenHistoria -configuration Release -sdk iphoneos -derivedDataPath apple/build/device CODE_SIGNING_ALLOWED=NO build
      - name: Check App Clip size
        run: node apple/scripts/check-size.mjs apple/build/device/Build/Products/Release-iphoneos/OpenHistoria.app/AppClips/OpenHistoriaClip.app
      # iOS 18.5 cannot load libswiftWebKit for deployment targets <18.4
      # (WebKit bug 293831). 18.6 fixes the runtime without changing our target.
      - name: Boot iOS 18.6 simulator
        id: simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; print(next(d["udid"] for runtime,ds in json.load(sys.stdin)["devices"].items() if runtime.endswith("iOS-18-6") for d in ds if d["name"].startswith("iPhone")))')
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Test on iPhone simulator
        env:
          DEVICE: ${{ steps.simulator.outputs.device }}
        run: |
          xcodebuild -project apple/OpenHistoria.xcodeproj -scheme OpenHistoria -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 -derivedDataPath apple/build/simulator -resultBundlePath apple/build/results.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Test App Clip on iPhone simulator
        env:
          DEVICE: ${{ steps.simulator.outputs.device }}
        run: |
          xcrun simctl uninstall "$DEVICE" org.openhistoria.game || true
          xcodebuild -project apple/OpenHistoria.xcodeproj -scheme OpenHistoriaClip -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 -derivedDataPath apple/build/clip-simulator -resultBundlePath apple/build/clip-results.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Export simulator diagnostics on failure
        if: failure()
        run: |
          for RESULT in results clip-results; do
            if [ -d "apple/build/$RESULT.xcresult" ]; then
              xcrun xcresulttool export diagnostics --path "apple/build/$RESULT.xcresult" --output-path "apple/build/diagnostics/$RESULT" || true
            fi
          done
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('apple/build/diagnostics').rglob('OpenHistoria*.ips'):
              print(p)
              for line in p.read_text(errors='replace').splitlines():
                  if any(word in line for word in ['"exception"', '"termination"', '"asi"']):
                      print(line[:12000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-validation
          path: |
            apple/build-size.json
            apple/build/results.xcresult
            apple/build/clip-results.xcresult
            apple/build/diagnostics
            apple/build/device/Build/Products/Release-iphoneos/*.app
          retention-days: 7
