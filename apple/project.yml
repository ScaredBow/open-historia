name: OpenHistoria
options:
  bundleIdPrefix: org.openhistoria
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '16.0'
packages:
  HistoriaCore:
    path: .
configFiles:
  Debug: Config/Build.xcconfig
  Release: Config/Build.xcconfig
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targetTemplates:
  Game:
    platform: iOS
    sources:
      - path: Sources/App
      - path: Resources/bridge.js
        buildPhase: resources
      - path: Resources/www
        type: folder
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: HistoriaCore
    settings:
      base:
        INFOPLIST_FILE: Config/App.plist
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks

targets:
  OpenHistoria:
    templates: [Game]
    type: application
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HISTORIA_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
    dependencies:
      - target: OpenHistoriaClip
        embed: true
    scheme:
      testTargets: [OpenHistoriaTests, OpenHistoriaUITests]
      gatherCoverageData: true
  OpenHistoriaClip:
    templates: [Game]
    type: application.on-demand-install-capable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HISTORIA_BUNDLE_ID).Clip
        INFOPLIST_FILE: Config/Clip.plist
        CODE_SIGN_ENTITLEMENTS: Config/Clip.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) APPCLIP
    scheme: {}
  OpenHistoriaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: OpenHistoria
      - package: HistoriaCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(HISTORIA_BUNDLE_ID).Tests
  OpenHistoriaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: OpenHistoria
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(HISTORIA_BUNDLE_ID).UITests
